name: RIOSE CI and scientific gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_heavy:
        description: Emit a provenance-bound simulation campaign request
        required: false
        default: false
        type: boolean
      scenario:
        description: Simulation scenario identifier
        required: false
        type: string
      seed:
        description: Explicit deterministic random seed
        required: false
        type: string
      duration:
        description: Requested campaign duration in seconds
        required: false
        type: string
      backend:
        description: Simulation backend identifier
        required: false
        type: string
      config_path:
        description: Repository-relative path to the exact campaign configuration, if available
        required: false
        type: string
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  pr-fast:
    name: PR fast gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          version: "0.11.7"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked Python dependencies
        run: uv sync --locked --extra dev
      - name: Run PR fast gate
        run: uv run --locked python scripts/ci/run_gate.py fast

  scientific-integrity:
    name: Scientific integrity gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          version: "0.11.7"
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Install locked Python and EVM dependencies
        run: uv sync --locked --extra dev --extra solana --extra evm
      - name: Install locked local EVM dependencies
        run: npm ci --prefix contracts
      - name: Run scientific integrity gate
        run: uv run --locked python scripts/ci/run_gate.py scientific

  main-regression:
    name: Main regression gate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          version: "0.11.7"
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Install locked Python and EVM dependencies
        run: uv sync --locked --extra dev --extra solana --extra evm
      - name: Run full Python, Solidity, CTest, and package regression
        run: uv run --locked python scripts/ci/run_gate.py main

  cad-export:
    name: CAD export regression
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          version: "0.11.7"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked Python and CAD dependencies
        run: |
          uv sync --locked --extra dev
          uv pip install --python .venv/bin/python -r requirements-cad.txt
      - name: Export STEP and STL headlessly
        run: .venv/bin/python -m pytest -q hardware/mechanical/tests/test_model.py -k 'headless_step_stl_export_and_provenance or current_candidate_step_stl_uses_spec_positions_and_provenance or current_candidate_coordinate_overrides_change_real_step'
        env:
          RIOSE_REQUIRE_CADQUERY: "1"

  heavy-request:
    name: Heavy validation request
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_heavy == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          version: "0.11.7"
          python-version: "3.12"
      - name: Install gate dependencies
        run: uv sync --locked --extra dev
      - name: Validate and record campaign request
        env:
          RIOSE_SCENARIO: ${{ inputs.scenario }}
          RIOSE_SEED: ${{ inputs.seed }}
          RIOSE_DURATION: ${{ inputs.duration }}
          RIOSE_BACKEND: ${{ inputs.backend }}
          RIOSE_CONFIG_PATH: ${{ inputs.config_path }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            RIOSE_SCENARIO=scheduled-contract-smoke
            RIOSE_SEED=1
            RIOSE_DURATION=1
            RIOSE_BACKEND=contract-only
          fi
          uv run --no-project python scripts/ci/run_gate.py heavy \
            --scenario "$RIOSE_SCENARIO" --seed "$RIOSE_SEED" \
            --duration "$RIOSE_DURATION" --backend "$RIOSE_BACKEND" \
            --artifact-directory "$RUNNER_TEMP/riose-heavy-request" \
            --config-file "$RIOSE_CONFIG_PATH"
          cat "$RUNNER_TEMP/riose-heavy-request/campaign-request.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: riose-heavy-request
          path: ${{ runner.temp }}/riose-heavy-request/campaign-request.json
          if-no-files-found: error
