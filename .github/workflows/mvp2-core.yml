name: MVP 2 digital twin core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cad-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          python-version: "3.12"
          enable-cache: true
      - name: Install CAD dependencies
        run: |
          uv sync --locked --extra dev
          uv pip install --python .venv/bin/python -r requirements-cad.txt
      - name: Export STEP and STL headlessly
        run: .venv/bin/python -m pytest -q hardware/mechanical/tests/test_model.py -k 'headless_step_stl_export_and_provenance or current_candidate_step_stl_uses_spec_positions_and_provenance or current_candidate_coordinate_overrides_change_real_step'
        env:
          RIOSE_REQUIRE_CADQUERY: "1"
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Install locked Python dependencies
        run: uv sync --locked --extra dev --extra solana --extra evm
      - name: Install locked local EVM dependencies
        run: npm ci --prefix contracts
      - name: Compile local EVM registry
        run: node contracts/test/compile_registry.cjs contracts/src/RioseCommitmentRegistry.sol
      - name: Validate hardware spec provenance
        run: uv run --locked python -m riose.products.ear_tag.digital_twin validate-spec
      - name: Probe optional headless tools
        run: uv run --locked python -m riose.products.ear_tag.digital_twin preflight
      - name: Python test suite
        run: uv run --locked pytest -q
      - name: C firmware and virtual model tests
        run: make hardware-test
      - name: Optional Renode platform smoke
        run: make hardware-renode-test
