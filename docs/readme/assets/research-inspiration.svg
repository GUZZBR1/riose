<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Research pipeline for a self-powered animal ear tag</title>
  <desc id="desc">An original conceptual diagram showing energy harvesting, biochemical sensing, and machine-learning interpretation, based on the cited Nature Communications paper.</desc>
  <rect width="1200" height="360" rx="24" fill="#f3f3f0"/>
  <text x="48" y="54" fill="#777873" font-family="Arial, sans-serif" font-size="15" letter-spacing="2.5">RESEARCH INSPIRATION · CONCEPTUAL SUMMARY</text>

  <g transform="translate(48 94)">
    <rect width="310" height="210" rx="18" fill="#fff" stroke="#deded9"/>
    <circle cx="57" cy="58" r="27" fill="#f4c928"/>
    <path d="M57 43v29M42 58h30" stroke="#252521" stroke-width="5" stroke-linecap="round"/>
    <text x="28" y="119" fill="#777873" font-family="Arial, sans-serif" font-size="14" letter-spacing="1.5">01 · POWER</text>
    <text x="28" y="157" fill="#20211e" font-family="Arial, sans-serif" font-size="25" font-weight="700">Energy harvesting</text>
    <text x="28" y="185" fill="#62635e" font-family="Arial, sans-serif" font-size="17">Motion + light</text>
  </g>

  <path d="M376 199h36m-10-10 10 10-10 10" fill="none" stroke="#92938d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

