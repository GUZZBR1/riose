    <text x="28" y="157" fill="#20211e" font-family="Arial, sans-serif" font-size="25" font-weight="700">Machine learning</text>
    <text x="28" y="185" fill="#62635e" font-family="Arial, sans-serif" font-size="17">Welfare-related states</text>
