    <path d="M31 65c14-26 27 26 41 0s27 26 41 0" fill="none" stroke="#32a67a" stroke-width="4" stroke-linecap="round"/>
    <text x="28" y="119" fill="#777873" font-family="Arial, sans-serif" font-size="14" letter-spacing="1.5">02 · SENSING</text>
    <text x="28" y="157" fill="#20211e" font-family="Arial, sans-serif" font-size="25" font-weight="700">Biochemical signals</text>
    <text x="28" y="185" fill="#62635e" font-family="Arial, sans-serif" font-size="17">pH · K⁺ · Ca²⁺</text>
  </g>

  <path d="M773 199h36m-10-10 10 10-10 10" fill="none" stroke="#92938d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(842 94)">
